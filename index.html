

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SalaryVault — Smart Finance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SalaryVault">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #030712;
            --bg-surface: #0f172a;
            --accent-cyan: #06b6d4;
            --accent-purple: #c084fc;
            --success: #10b981;
            --danger: #f43f5e;
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #0a0f1c, #020617);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            width: 100%;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .mobile-container {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            padding-bottom: 75px;
        }

        /* Header */
        .app-header {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(16px);
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(6, 182, 212, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i {
            font-size: 24px;
            background: linear-gradient(145deg, #06b6d4, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo span {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e0f2fe, #e9d5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: rgba(30, 41, 59, 0.8);
            border: none;
            padding: 7px 12px;
            border-radius: 40px;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .main-content {
            padding: 16px;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* Bottom Navigation - Fixed 5 items + More button */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            border-top: 1px solid rgba(6, 182, 212, 0.4);
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            padding: 6px 10px;
            border-radius: 40px;
            background: transparent;
            flex: 1;
            text-align: center;
        }

        .nav-item i {
            font-size: 1.3rem;
        }

        .nav-item.active {
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.15);
        }

        /* More Menu Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .more-menu {
            background: rgba(17, 24, 39, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .more-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .more-menu-header h4 {
            font-size: 1.1rem;
            color: var(--accent-cyan);
        }

        .close-menu {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .more-menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .more-menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .more-menu-item i {
            font-size: 1.8rem;
            color: var(--accent-cyan);
        }

        .more-menu-item span {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .more-menu-item:active {
            background: rgba(6, 182, 212, 0.2);
            transform: scale(0.98);
        }

        /* Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .stat-card {
            background: linear-gradient(145deg, #111827cc, #0f172acc);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 14px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-number {
            font-size: 1.4rem;
            font-weight: 800;
            word-break: break-word;
        }

        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        .form-card {
            background: rgba(17, 24, 39, 0.85);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2d3a5e;
            width: 100%;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select, textarea {
            background: #030712;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 11px 14px;
            width: 100%;
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .btn-primary {
            background: linear-gradient(105deg, #0891b2, #06b6d4);
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            width: 100%;
            font-size: 0.9rem;
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #06b6d460;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            color: #e2e8f0;
        }

        .calc-card {
            background: linear-gradient(135deg, #0f172ae6, #111827e6);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .calc-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .calc-input-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .instant-items {
            background: #03071280;
            border-radius: 20px;
            padding: 12px;
            margin-top: 16px;
            max-height: 250px;
            overflow-y: auto;
        }

        .instant-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #334155;
            align-items: center;
        }

        .total-row {
            margin-top: 16px;
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            border-top: 2px dashed var(--accent-cyan);
            padding-top: 12px;
        }

        .chart-card {
            background: rgba(17, 24, 39, 0.7);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
            width: 100%;
        }

        .chart-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 500px;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid #1e293b;
            font-size: 0.75rem;
        }

        th {
            background: #1e293b80;
        }

        .badge {
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }

        .action-btn {
            cursor: pointer;
            background: #1e293b;
            padding: 5px 8px;
            border-radius: 20px;
            margin: 0 2px;
            display: inline-block;
            font-size: 0.7rem;
        }

        .toast {
            position: fixed;
            bottom: 85px;
            left: 16px;
            right: 16px;
            background: #111827f2;
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--success);
            padding: 12px 16px;
            border-radius: 40px;
            display: none;
            z-index: 200;
            text-align: center;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .flex-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .main-content {
                max-width: 1200px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
<div class="mobile-container">
    <div class="app-header">
        <div class="logo">
            <i class="fas fa-calculator"></i>
            <span>SalaryVault</span>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="exportBtn"><i class="fas fa-download"></i></button>
            <button class="btn-icon" id="installBtn" style="display: none;"><i class="fas fa-download"></i></button>
        </div>
    </div>

    <div class="main-content" id="mainContent"></div>

    <!-- Bottom Navigation - 5 items + More button -->
    <div class="bottom-nav">
        <div class="nav-item active" data-page="dashboard">
            <i class="fas fa-chart-line"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" data-page="income">
            <i class="fas fa-circle-dollar"></i>
            <span>Income</span>
        </div>
        <div class="nav-item" data-page="expense">
            <i class="fas fa-cart-shopping"></i>
            <span>Expense</span>
        </div>
        <div class="nav-item" data-page="calculator">
            <i class="fas fa-calculator"></i>
            <span>Calc</span>
        </div>
        <div class="nav-item" id="moreBtn">
            <i class="fas fa-bars"></i>
            <span>More</span>
        </div>
    </div>
</div>

<!-- More Menu Modal -->
<div class="modal-overlay" id="moreModal">
    <div class="more-menu">
        <div class="more-menu-header">
            <h4><i class="fas fa-compass"></i> More Features</h4>
            <button class="close-menu" id="closeModalBtn">&times;</button>
        </div>
        <div class="more-menu-grid">
            <div class="more-menu-item" data-page="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </div>
            <div class="more-menu-item" data-page="transactions">
                <i class="fas fa-clock-rotate-left"></i>
                <span>Transactions</span>
            </div>
            <div class="more-menu-item" data-page="summary">
                <i class="fas fa-chart-pie"></i>
                <span>Summary</span>
            </div>
            <div class="more-menu-item" id="exportMenuItem">
                <i class="fas fa-download"></i>
                <span>Export Data</span>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    // App State
    let appStore = {
        profile: { name: "", email: "", salary: 0, currency: "USD" },
        transactions: []
    };
    
    let instantBasket = [];
    let currentPage = "dashboard";
    let charts = {};

    function getSymbol(cur) {
        const symbols = { USD: "$", EUR: "€", GBP: "£", BDT: "৳", INR: "₹" };
        return symbols[cur] || "$";
    }

    function formatMoney(amt) {
        return `${getSymbol(appStore.profile.currency)} ${Math.abs(amt).toFixed(2)}`;
    }

    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function saveData() {
        localStorage.setItem("salaryVault_data", JSON.stringify({
            profile: appStore.profile,
            transactions: appStore.transactions
        }));
    }

    function loadData() {
        const raw = localStorage.getItem("salaryVault_data");
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.profile) appStore.profile = data.profile;
                if (data.transactions) appStore.transactions = data.transactions;
            } catch(e) {}
        }
        if (!appStore.profile.currency) appStore.profile.currency = "USD";
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById("toastMsg");
        toast.textContent = (isError ? "⚠️ " : "✅ ") + msg;
        toast.style.display = "block";
        toast.style.borderLeftColor = isError ? "#f43f5e" : "#10b981";
        setTimeout(() => toast.style.display = "none", 2500);
    }

    function getMonthTotals() {
        const currentMonth = new Date().toISOString().slice(0, 7);
        const monthTx = appStore.transactions.filter(t => t.date.startsWith(currentMonth));
        const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        return { income, expense, balance: income - expense };
    }

    // DASHBOARD
    function renderDashboard() {
        const { income, expense, balance } = getMonthTotals();
        const salary = appStore.profile.salary;
        return `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label"><i class="fas fa-arrow-up"></i> Income</div><div class="stat-number text-success">${formatMoney(income)}</div></div>
                <div class="stat-card"><div class="stat-label"><i class="fas fa-arrow-down"></i> Expense</div><div class="stat-number text-danger">${formatMoney(expense)}</div></div>
                <div class="stat-card"><div class="stat-label"><i class="fas fa-wallet"></i> Balance</div><div class="stat-number">${formatMoney(balance)}</div></div>
                <div class="stat-card"><div class="stat-label"><i class="fas fa-briefcase"></i> Salary</div><div class="stat-number">${formatMoney(salary)}</div></div>
            </div>
            <div class="chart-card"><div class="chart-title">📊 Spending by Category</div><canvas id="categoryChart" height="200"></canvas></div>
            <div class="chart-card"><div class="chart-title">📈 6-Month Trend</div><canvas id="trendChart" height="200"></canvas></div>
        `;
    }

    // PROFILE
    function renderProfile() {
        return `
            <div class="form-card">
                <h3>👤 Your Profile</h3>
                <div class="form-group"><label>Full Name</label><input type="text" id="profileName" placeholder="Your name" value="${escapeHtml(appStore.profile.name || '')}"></div>
                <div class="form-group"><label>Email</label><input type="email" id="profileEmail" placeholder="Email" value="${escapeHtml(appStore.profile.email || '')}"></div>
                <div class="form-group"><label>Monthly Salary</label><input type="number" id="profileSalary" step="0.01" placeholder="Monthly salary" value="${appStore.profile.salary || 0}"></div>
                <div class="form-group"><label>Currency</label><select id="profileCurrency">${['USD', 'EUR', 'GBP', 'BDT', 'INR'].map(c => `<option ${appStore.profile.currency === c ? 'selected' : ''} value="${c}">${c}</option>`).join('')}</select></div>
                <button class="btn-primary" id="saveProfileBtn">💾 Save Profile</button>
            </div>
        `;
    }

    // INCOME
    function renderIncome() {
        return `
            <div class="form-card">
                <h3>💰 Add Income</h3>
                <div class="form-group"><label>Amount</label><input type="number" id="incomeAmount" step="0.01" placeholder="Amount"></div>
                <div class="form-group"><label>Date</label><input type="date" id="incomeDate" value="${new Date().toISOString().slice(0, 10)}"></div>
                <div class="form-group"><label>Category</label><select id="incomeCategory"><option>Salary</option><option>Freelance</option><option>Business</option><option>Investment</option><option>Other</option></select></div>
                <div class="form-group"><label>Note</label><textarea id="incomeNote" rows="2" placeholder="Add a note..."></textarea></div>
                <button class="btn-primary" id="addIncomeBtn">➕ Add Income</button>
            </div>
        `;
    }

    // EXPENSE
    function renderExpense() {
        return `
            <div class="form-card">
                <h3>💸 Add Expense</h3>
                <div class="form-group"><label>Amount</label><input type="number" id="expenseAmount" step="0.01" placeholder="Amount"></div>
                <div class="form-group"><label>Date</label><input type="date" id="expenseDate" value="${new Date().toISOString().slice(0, 10)}"></div>
                <div class="form-group"><label>Category</label><select id="expenseCategory"><option>Food</option><option>Transport</option><option>Shopping</option><option>Entertainment</option><option>Bills</option><option>Rent</option><option>Other</option></select></div>
                <div class="form-group"><label>Description</label><input type="text" id="expenseDesc" placeholder="What did you buy?"></div>
                <button class="btn-primary" id="addExpenseBtn">💳 Add Expense</button>
            </div>
        `;
    }

    // CALCULATOR
    function renderCalculator() {
        let itemsHtml = '';
        let total = 0;
        instantBasket.forEach((item, idx) => {
            total += item.amount;
            itemsHtml += `<div class="instant-item"><span><i class="fas fa-receipt"></i> ${escapeHtml(item.name)}</span><span>${formatMoney(item.amount)} <span class="action-btn" onclick="removeItem(${idx})"><i class="fas fa-trash"></i></span></span></div>`;
        });
        return `
            <div class="calc-card">
                <h3>⚡ Instant Calculator</h3>
                <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 16px;">Track daily spending & save as expenses</p>
                <div class="calc-input-row">
                    <div class="form-group" style="flex: 2;"><label>Item name</label><input type="text" id="itemName" placeholder="e.g., Coffee, Lunch"></div>
                    <div class="form-group" style="flex: 1;"><label>Amount</label><input type="number" id="itemAmount" step="0.01" placeholder="0.00"></div>
                </div>
                <button class="btn-primary" id="addItemBtn">➕ Add to List</button>
                <div class="instant-items">${itemsHtml || '<div class="empty-state">No items yet. Add your first expense!</div>'}</div>
                <div class="total-row"><strong>Total: ${formatMoney(total)}</strong></div>
                <div class="flex-btns"><button class="btn-secondary" id="clearItemsBtn" style="flex:1;">🗑️ Clear All</button><button class="btn-primary" id="saveItemsBtn" style="flex:1;">💾 Save as Expenses</button></div>
            </div>
        `;
    }

    // TRANSACTIONS
    function renderTransactions() {
        return `
            <div style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
                <select id="transFilter" style="flex: 1;"><option value="">All</option><option value="income">Income</option><option value="expense">Expense</option></select>
                <input type="month" id="transMonth" style="flex: 1;" value="${new Date().toISOString().slice(0, 7)}">
                <button class="btn-secondary" id="resetTransBtn">Reset</button>
            </div>
            <div class="table-wrapper"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody id="transList"></tbody></table></div>
            <div id="transEmpty" class="empty-state" style="display: none;">📭 No transactions yet</div>
        `;
    }

    function updateTransactionsList() {
        const filterType = document.getElementById("transFilter")?.value || "";
        const filterMonth = document.getElementById("transMonth")?.value || "";
        let filtered = [...appStore.transactions];
        if (filterType) filtered = filtered.filter(t => t.type === filterType);
        if (filterMonth) filtered = filtered.filter(t => t.date.startsWith(filterMonth));
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
        const tbody = document.getElementById("transList");
        const empty = document.getElementById("transEmpty");
        if (!tbody) return;
        if (filtered.length === 0) { tbody.innerHTML = ""; if (empty) empty.style.display = "block"; return; }
        if (empty) empty.style.display = "none";
        tbody.innerHTML = filtered.map(t => `<tr><td>${formatDate(t.date)}</td><td><span class="badge">${t.type === 'income' ? '💰' : '💸'}</span></td><td>${t.category}</td><td class="${t.type === 'income' ? 'text-success' : 'text-danger'}">${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}</td><td><span class="action-btn" onclick="editTransaction(${t.id})"><i class="fas fa-edit"></i></span> <span class="action-btn" onclick="deleteTransaction(${t.id})"><i class="fas fa-trash"></i></span></td></tr>`).join('');
    }

    // SUMMARY
    function renderSummary() {
        return `
            <div style="margin-bottom: 16px;"><label>📅 Month: </label><input type="month" id="summaryMonth" value="${new Date().toISOString().slice(0, 7)}"></div>
            <div class="stats-grid" id="summaryStats"></div>
            <div class="chart-card"><div class="chart-title">📊 Category Breakdown</div><canvas id="summaryPieChart" height="200"></canvas></div>
            <div class="table-wrapper"></table><thead><tr><th>Category</th><th>Count</th><th>Amount</th><th>%</th></tr></thead><tbody id="summaryTable"></tbody></table></div>
        `;
    }

    function updateSummary() {
        const month = document.getElementById("summaryMonth")?.value || new Date().toISOString().slice(0, 7);
        const monthTx = appStore.transactions.filter(t => t.date.startsWith(month));
        const totalInc = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const totalExp = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        const saved = totalInc - totalExp;
        
        const statsDiv = document.getElementById("summaryStats");
        if (statsDiv) {
            statsDiv.innerHTML = `
                <div class="stat-card"><div class="stat-label">Income</div><div class="stat-number text-success">${formatMoney(totalInc)}</div></div>
                <div class="stat-card"><div class="stat-label">Expense</div><div class="stat-number text-danger">${formatMoney(totalExp)}</div></div>
                <div class="stat-card"><div class="stat-label">Saved</div><div class="stat-number">${formatMoney(saved)}</div></div>
            `;
        }
        
        const catExp = {};
        monthTx.filter(t => t.type === 'expense').forEach(e => { catExp[e.category] = (catExp[e.category] || 0) + e.amount; });
        
        const tbody = document.getElementById("summaryTable");
        if (tbody) {
            tbody.innerHTML = Object.entries(catExp).map(([cat, amt]) => `<tr><td>${cat}</td><td>${monthTx.filter(t => t.type === 'expense' && t.category === cat).length}</td><td class="text-danger">${formatMoney(amt)}</td><td>${totalExp > 0 ? ((amt / totalExp) * 100).toFixed(1) + '%' : '0%'}</td></tr>`).join('');
        }
        
        const pieCtx = document.getElementById("summaryPieChart")?.getContext('2d');
        if (pieCtx) {
            if (charts.summary) charts.summary.destroy();
            charts.summary = new Chart(pieCtx, {
                type: 'pie',
                data: { labels: Object.keys(catExp), datasets: [{ data: Object.values(catExp), backgroundColor: ['#06b6d4', '#10b981', '#f59e0b', '#f43f5e', '#c084fc', '#3b82f6'] }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }
    }

    // Dashboard Charts
    function loadDashboardCharts() {
        const currentMonth = new Date().toISOString().slice(0, 7);
        const monthTx = appStore.transactions.filter(t => t.date.startsWith(currentMonth));
        const expenses = monthTx.filter(t => t.type === 'expense');
        const categoryMap = {};
        expenses.forEach(e => { categoryMap[e.category] = (categoryMap[e.category] || 0) + e.amount; });
        
        const ctx1 = document.getElementById("categoryChart")?.getContext('2d');
        if (ctx1) {
            if (charts.category) charts.category.destroy();
            charts.category = new Chart(ctx1, { type: 'doughnut', data: { labels: Object.keys(categoryMap), datasets: [{ data: Object.values(categoryMap), backgroundColor: ['#06b6d4', '#10b981', '#f59e0b', '#f43f5e', '#c084fc', '#3b82f6'] }] }, options: { responsive: true, maintainAspectRatio: true } });
        }
        
        const months = [];
        for (let i = 5; i >= 0; i--) { let d = new Date(); d.setMonth(d.getMonth() - i); months.push(d.toISOString().slice(0, 7)); }
        const incomeTrend = months.map(m => appStore.transactions.filter(t => t.type === 'income' && t.date.startsWith(m)).reduce((s, t) => s + t.amount, 0));
        const expenseTrend = months.map(m => appStore.transactions.filter(t => t.type === 'expense' && t.date.startsWith(m)).reduce((s, t) => s + t.amount, 0));
        
        const ctx2 = document.getElementById("trendChart")?.getContext('2d');
        if (ctx2) {
            if (charts.trend) charts.trend.destroy();
            charts.trend = new Chart(ctx2, { type: 'line', data: { labels: months.map(m => m.slice(5) + '/' + m.slice(0, 4)), datasets: [{ label: 'Income', data: incomeTrend, borderColor: '#10b981', tension: 0.3 }, { label: 'Expense', data: expenseTrend, borderColor: '#f43f5e', tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: true } });
        }
    }

    // Page Router
    function renderPage() {
        const container = document.getElementById("mainContent");
        if (!container) return;
        
        switch(currentPage) {
            case "dashboard":
                container.innerHTML = renderDashboard();
                setTimeout(loadDashboardCharts, 50);
                break;
            case "profile":
                container.innerHTML = renderProfile();
                document.getElementById("saveProfileBtn")?.addEventListener("click", () => {
                    appStore.profile.name = document.getElementById("profileName").value;
                    appStore.profile.email = document.getElementById("profileEmail").value;
                    appStore.profile.salary = parseFloat(document.getElementById("profileSalary").value) || 0;
                    appStore.profile.currency = document.getElementById("profileCurrency").value;
                    saveData();
                    showToast("Profile saved");
                    renderPage();
                });
                break;
            case "income":
                container.innerHTML = renderIncome();
                document.getElementById("addIncomeBtn")?.addEventListener("click", () => {
                    const amount = parseFloat(document.getElementById("incomeAmount").value);
                    if (isNaN(amount) || amount <= 0) { showToast("Enter valid amount", true); return; }
                    appStore.transactions.push({ id: Date.now(), type: 'income', amount: amount, date: document.getElementById("incomeDate").value, category: document.getElementById("incomeCategory").value, description: document.getElementById("incomeNote").value });
                    saveData();
                    showToast(`Added ${formatMoney(amount)} as income`);
                    document.getElementById("incomeAmount").value = "";
                    renderPage();
                });
                break;
            case "expense":
                container.innerHTML = renderExpense();
                document.getElementById("addExpenseBtn")?.addEventListener("click", () => {
                    const amount = parseFloat(document.getElementById("expenseAmount").value);
                    if (isNaN(amount) || amount <= 0) { showToast("Enter valid amount", true); return; }
                    appStore.transactions.push({ id: Date.now(), type: 'expense', amount: amount, date: document.getElementById("expenseDate").value, category: document.getElementById("expenseCategory").value, description: document.getElementById("expenseDesc").value });
                    saveData();
                    showToast(`Added ${formatMoney(amount)} as expense`);
                    document.getElementById("expenseAmount").value = "";
                    renderPage();
                });
                break;
            case "calculator":
                container.innerHTML = renderCalculator();
                attachCalculatorEvents();
                break;
            case "transactions":
                container.innerHTML = renderTransactions();
                updateTransactionsList();
                document.getElementById("transFilter")?.addEventListener("change", () => updateTransactionsList());
                document.getElementById("transMonth")?.addEventListener("change", () => updateTransactionsList());
                document.getElementById("resetTransBtn")?.addEventListener("click", () => {
                    if (document.getElementById("transFilter")) document.getElementById("transFilter").value = "";
                    if (document.getElementById("transMonth")) document.getElementById("transMonth").value = new Date().toISOString().slice(0, 7);
                    updateTransactionsList();
                });
                break;
            case "summary":
                container.innerHTML = renderSummary();
                updateSummary();
                document.getElementById("summaryMonth")?.addEventListener("change", () => updateSummary());
                break;
        }
    }
    
    function attachCalculatorEvents() {
        document.getElementById("addItemBtn")?.addEventListener("click", () => {
            const name = document.getElementById("itemName")?.value.trim();
            const amount = parseFloat(document.getElementById("itemAmount")?.value);
            if (!name || isNaN(amount) || amount <= 0) { showToast("Enter item name and valid amount", true); return; }
            instantBasket.push({ name, amount });
            document.getElementById("itemName").value = "";
            document.getElementById("itemAmount").value = "";
            renderPage();
        });
        document.getElementById("clearItemsBtn")?.addEventListener("click", () => { instantBasket = []; renderPage(); });
        document.getElementById("saveItemsBtn")?.addEventListener("click", () => {
            if (instantBasket.length === 0) { showToast("No items to save", true); return; }
            const today = new Date().toISOString().slice(0, 10);
            for (let item of instantBasket) { appStore.transactions.push({ id: Date.now() + Math.random(), type: 'expense', amount: item.amount, date: today, category: "Quick Shop", description: item.name }); }
            saveData();
            instantBasket = [];
            showToast(`Saved expenses from calculator`);
            renderPage();
        });
    }
    
    window.removeItem = (idx) => { instantBasket.splice(idx, 1); renderPage(); };
    window.editTransaction = (id) => {
        const tx = appStore.transactions.find(t => t.id === id);
        if (tx) {
            const newAmount = prompt("Edit amount", tx.amount);
            if (newAmount && !isNaN(parseFloat(newAmount))) {
                tx.amount = parseFloat(newAmount);
                saveData();
                showToast("Transaction updated");
                if (currentPage === "transactions") updateTransactionsList();
                else renderPage();
            }
        }
    };
    window.deleteTransaction = (id) => {
        if (confirm("Delete this transaction?")) {
            appStore.transactions = appStore.transactions.filter(t => t.id !== id);
            saveData();
            showToast("Deleted");
            if (currentPage === "transactions") updateTransactionsList();
            else renderPage();
        }
    };
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    
    // Modal functions
    function openModal() {
        document.getElementById("moreModal").classList.add("show");
    }
    
    function closeModal() {
        document.getElementById("moreModal").classList.remove("show");
    }
    
    // Navigation
    function switchPage(page) {
        currentPage = page;
        document.querySelectorAll(".nav-item").forEach(item => {
            if (item.getAttribute("data-page") === page) item.classList.add("active");
            else item.classList.remove("active");
        });
        closeModal();
        renderPage();
    }
    
    // Event Listeners
    document.querySelectorAll(".nav-item[data-page]").forEach(btn => {
        btn.addEventListener("click", () => switchPage(btn.getAttribute("data-page")));
    });
    
    document.getElementById("moreBtn")?.addEventListener("click", openModal);
    document.getElementById("closeModalBtn")?.addEventListener("click", closeModal);
    document.querySelectorAll(".more-menu-item[data-page]").forEach(item => {
        item.addEventListener("click", () => switchPage(item.getAttribute("data-page")));
    });
    
    document.getElementById("exportMenuItem")?.addEventListener("click", () => {
        const dataStr = JSON.stringify(appStore, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `salaryvault_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast("Data exported");
        closeModal();
    });
    
    document.getElementById("exportBtn")?.addEventListener("click", () => {
        const dataStr = JSON.stringify(appStore, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `salaryvault_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast("Data exported");
    });
    
    // Close modal when clicking outside
    document.getElementById("moreModal")?.addEventListener("click", (e) => {
        if (e.target === document.getElementById("moreModal")) closeModal();
    });
    
    // PWA Install
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = "flex"; });
    installBtn.addEventListener("click", async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === "accepted") installBtn.style.display = "none"; deferredPrompt = null; } });
    
    // Initialize
    loadData();
    renderPage();
</script>
</body>
</html>
